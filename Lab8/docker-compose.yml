services:
  node-app-1:
    build: ./node-service
    expose:
      - "3000"
    environment:
      REPO_TYPE: postgres
      PG_HOST: postgres
      PG_USER: appuser
      PG_PASSWORD: secret
      PG_DB: appdb
      MONGO_URI: mongodb://appuser:secret@mongo:27017
      JWT_SECRET: 
      JWT_REFRESH_SECRET: 
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  node-app-2:
    build: ./node-service
    expose:
      - "3000"
    environment:
      REPO_TYPE: postgres
      PG_HOST: postgres
      PG_USER: appuser
      PG_PASSWORD: secret
      PG_DB: appdb
      MONGO_URI: mongodb://appuser:secret@mongo:27017
      JWT_SECRET: 
      JWT_REFRESH_SECRET: 
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  node-app-3:
    build: ./node-service
    expose:
      - "3000"
    environment:
      REPO_TYPE: postgres
      PG_HOST: postgres
      PG_USER: appuser
      PG_PASSWORD: secret
      PG_DB: appdb
      MONGO_URI: mongodb://appuser:secret@mongo:27017
      JWT_SECRET: 
      JWT_REFRESH_SECRET: 
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  go-app:
    build: ./go-service
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../Lab7/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    expose:
      - "27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: appuser
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: appdb
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./static:/var/www/app/static:ro
    depends_on:
      - node-app-1
      - node-app-2
      - node-app-3
      - go-app
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
